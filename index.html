<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Static GIF'd demo with depth preview only."
    />
    <title>GIF'd Demo</title>
    <link rel="stylesheet" href="./css/whisper.css" />
    <link rel="stylesheet" href="./css/styles.css" />
    <style>
      .demo-image-list-offset {
        margin-top: 50px;
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <h1>GIF'd <span class="small">from <a href="https://adrian3.com/" target="_blank" rel="noopener noreferrer">Ade</a></span></h1>
          <p><em>A tool for creating animated GIFs from iPhone spatial photos.</em></p>
        </div>
      </header>

      <main class="viewer-shell">
        <aside class="image-panel">
          <div id="imageList" class="image-list demo-image-list-offset" aria-label="Demo image library"></div>
          <p class="drop-zone-helper">View the <a href="./README.md" target="_blank" rel="noopener noreferrer">readme</a> for info about how to install this tool on your computer.</p>
        </aside>

        <section class="viewer-panel">
          <div class="viewer-stage">
            <div id="viewer"></div>
          </div>
          <div class="viewer-controls-bar">
            <label class="strength-control">
              <span class="strength-label">Depth strength (<span id="strengthValue" class="strength-value">15</span>)</span>
              <input id="strengthSlider" type="range" min="5" max="80" value="15" />
            </label>
            <label class="mode-control">
              <span>Direction</span>
              <select id="viewerModeSelect">
                <option value="default3d">360°</option>
                <option value="pan">Pan (right/left)</option>
                <option value="tilt">Tilt (up/down)</option>
                <option value="diag-tl-br">Top left to bottom right</option>
                <option value="diag-tr-bl">Top right to bottom left</option>
              </select>
            </label>
            <div class="viewer-action-buttons">
              <button id="exampleGifButton" class="action-button" type="button">Example GIF</button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <dialog id="exampleGifDialog" class="gif-dialog gif-preview-dialog">
      <form method="dialog" class="gif-dialog-form gif-preview-form">
        <header class="gif-dialog-header">
          <h2 id="exampleGifTitle">Example GIF</h2>
        </header>

        <div class="gif-preview-stage">
          <div id="exampleGifProgress" class="gif-preview-progress">
            <div class="gif-spinner" aria-hidden="true"></div>
            <p>Loading example GIF...</p>
          </div>
          <img id="exampleGifImage" class="gif-preview-image" alt="Example GIF preview" hidden />
        </div>

        <p id="exampleGifStatus" class="gif-preview-status"></p>

        <footer class="gif-dialog-actions">
          <button class="action-button" value="cancel">Close</button>
        </footer>
      </form>
    </dialog>

    <script src="./js/pixi.min.js"></script>
    <script src="./js/demo.js"></script>
  </body>
</html>
